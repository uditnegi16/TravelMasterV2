<!--
  Replaces a purple (#863bff) abstract mark that matched nothing else in
  the app. The header logo is a blue compass in a rounded square, so the
  browser tab now shows the same thing.

  Drawn to read at 16x16: a thick ring and one bold needle. The lucide
  Compass glyph has too much interior detail to survive that size.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#2454E0" />
  <circle cx="32" cy="32" r="18" stroke="#FFFFFF" stroke-width="4" fill="none" />
  <path d="M40.5 23.5 L27.5 29.5 L23.5 40.5 L36.5 34.5 Z" fill="#FFFFFF" />
</svg>
