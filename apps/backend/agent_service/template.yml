AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TravelGuru v2 Agent Service - Lambda deployment

Parameters:
  GroqApiKey:
    Type: String
    NoEcho: true
  GroqClassifierApiKey:
    Type: String
    NoEcho: true
  GroqPlannerApiKey:
    Type: String
    NoEcho: true
  OpenTripMapApiKey:
    Type: String
    NoEcho: true
  DuffelApiToken:
    Type: String
    NoEcho: true
  UpstashRedisRestUrl:
    Type: String
    NoEcho: true
  UpstashRedisRestToken:
    Type: String
    NoEcho: true
  NvidiaApiKey:
    Type: String
    NoEcho: true
  RazorpayKeyId:
    Type: String
    NoEcho: true
  RazorpayKeySecret:
    Type: String
    NoEcho: true
  RazorpayWebhookSecret:
    Type: String
    NoEcho: true
  SupabaseUrl:
    Type: String
    NoEcho: true
  SupabaseSecretKey:
    Type: String
    NoEcho: true
  ClerkSecretKey:
    Type: String
    NoEcho: true
  ClerkPublishableKey:
    Type: String
    NoEcho: true
  ClerkAuthorizedParties:
    Type: String
    NoEcho: true
  HfToken:
    Type: String
    NoEcho: true

Globals:
  Function:
    Timeout: 120
    MemorySize: 2048
    Architectures:
      - x86_64

Resources:
  TravelGuruAgentApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      BinaryMediaTypes:
         - "application/pdf"
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  TravelGuruAgentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest

    Properties:
      PackageType: Image

      Events:
        ProxyApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref TravelGuruAgentApi
            Path: /
            Method: ANY

        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref TravelGuruAgentApi
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          GROQ_API_KEY: !Ref GroqApiKey
          GROQ_CLASSIFIER_API_KEY: !Ref GroqClassifierApiKey
          GROQ_PLANNER_API_KEY: !Ref GroqPlannerApiKey
          WS_API_ID: !Ref TravelGuruWebSocketApi
          WS_API_STAGE: prod
          OPENTRIPMAP_API_KEY: !Ref OpenTripMapApiKey
          DUFFEL_API_TOKEN: !Ref DuffelApiToken
          UPSTASH_REDIS_REST_URL: !Ref UpstashRedisRestUrl
          UPSTASH_REDIS_REST_TOKEN: !Ref UpstashRedisRestToken
          NVIDIA_API_KEY: !Ref NvidiaApiKey
          RAZORPAY_KEY_ID: !Ref RazorpayKeyId
          RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret
          RAZORPAY_WEBHOOK_SECRET: !Ref RazorpayWebhookSecret
          PREMIUM_PLAN_AMOUNT: "39900"
          PREMIUM_PLAN_CURRENCY: "INR"
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SECRET_KEY: !Ref SupabaseSecretKey
          CLERK_SECRET_KEY: !Ref ClerkSecretKey
          CLERK_PUBLISHABLE_KEY: !Ref ClerkPublishableKey
          CLERK_AUTHORIZED_PARTIES: !Ref ClerkAuthorizedParties
          HF_TOKEN: !Ref HfToken
          ENVIRONMENT: "production"
          PDF_S3_BUCKET: "travelmaster-pdfs"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TravelGuruWebSocketApi}/*/POST/@connections/*"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: "arn:aws:s3:::travelmaster-pdfs/pdfs/*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: "*"
  TravelGuruWebSocketFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["ws_lambda_handler.handler"]
      Environment:
        Variables:
          UPSTASH_REDIS_REST_URL: !Ref UpstashRedisRestUrl
          UPSTASH_REDIS_REST_TOKEN: !Ref UpstashRedisRestToken

  TravelGuruWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: travelguru-ws-api
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TravelGuruWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TravelGuruWebSocketFunction.Arn}/invocations"

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TravelGuruWebSocketApi
      RouteKey: $connect
      Target: !Sub "integrations/${WebSocketIntegration}"

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TravelGuruWebSocketApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${WebSocketIntegration}"

  WebSocketDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TravelGuruWebSocketApi
      RouteKey: $default
      Target: !Sub "integrations/${WebSocketIntegration}"

  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - WebSocketConnectRoute
      - WebSocketDisconnectRoute
      - WebSocketDefaultRoute
    Properties:
      ApiId: !Ref TravelGuruWebSocketApi

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref TravelGuruWebSocketApi
      DeploymentId: !Ref WebSocketDeployment
      StageName: prod

  WebSocketLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TravelGuruWebSocketFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TravelGuruWebSocketApi}/*/*"
Outputs:
  AgentApiUrl:
    Description: Agent Service API endpoint
    Value: !Sub 'https://${TravelGuruAgentApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  AgentFunctionArn:
    Description: Agent Lambda Function ARN
    Value: !GetAtt TravelGuruAgentFunction.Arn
  WebSocketUrl:
    Description: WebSocket API endpoint
    Value: !Sub "wss://${TravelGuruWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
