name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/frontend

    env:
      # These are all publishable/public-by-design values (Clerk's own
      # convention lists the publishable key as a repo "variable," not
      # a secret) -- needed because Clerk's SDK makes a real network
      # call to validate and configure itself; a fabricated key
      # doesn't work and left the whole app failing to render in CI
      # (every Playwright test timed out finding *any* element).
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      VITE_RAZORPAY_KEY_ID: ${{ vars.VITE_RAZORPAY_KEY_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check -- production app
        run: npx tsc -b tsconfig.app.json --noEmit

      - name: Type Check -- test files
        run: npx tsc -p tsconfig.test.json --noEmit

      - name: Unit + Component Tests (with coverage thresholds)
        run: npx vitest run --coverage

      - name: Production Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Smoke Tests
        # Runs against the local dev server (webServer in
        # playwright.config.ts starts it) -- not a "preview
        # deployment" as the backlog names, since no preview-env
        # infrastructure exists for this project yet. Real, achievable
        # coverage of what's testable without a running backend +
        # mocked AI providers.
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 14

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/
